[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quickbooks-api"
version = "1.0.0"
description = "QuickBooks Online API client with MCP server integration for Claude"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "mcp>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
qbo-mcp-server = "quickbooks_api.mcp_server.server:main"

[tool.setuptools.packages.find]
include = ["quickbooks_api*"]
